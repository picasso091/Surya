# Bayesian search for the 224 teacher: learning rate, weight decay, learning-rate schedule and flare weight in the BCE.
# Each trial saves into experiments/results_224/sweep_correct_css/<decay>_lr<..>_wd<..>_pw<..>_<start time>/.

# Start (from downstream_examples/solar_flare_forcasting):
#   /home/rakshyapanta/.conda/envs/suryaenv/bin/wandb sweep experiments/teacher_224/sweep_css.yaml
#       -> prints the sweep id, e.g. <entity>/solar-flare-224/abc123
#   CUDA_VISIBLE_DEVICES=1 /home/rakshyapanta/.conda/envs/suryaenv/bin/wandb agent --count 20 <entity>/solar-flare-224/abc123

program: experiments/teacher_224/teacher224_lora.py
project: solar-flare-224
name: correct_css
method: bayes
metric: {name: valid/best_css, goal: maximize}
run_cap: 20
parameters:
  learning_rate: {distribution: log_uniform_values, min: 1.0e-6, max: 3.0e-4}
  weight_decay: {distribution: log_uniform_values, min: 1.0e-4, max: 1.0e-1}
  decay: {values: [none, cosine, warmup_cosine]}
  pos_weight: {values: [plain, half, full]}
command:
  - /home/rakshyapanta/.conda/envs/suryaenv/bin/python
  - ${program}
  - --sweep
  - --run_name
  - sweep_correct_css
  - --group
  - correct_css
  - --epochs
  - "50"
  - --patience
  - none
  - ${args}
